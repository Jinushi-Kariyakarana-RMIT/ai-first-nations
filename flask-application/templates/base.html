<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mangrove AI{% endblock %} | AI First Nations</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='ai-first-nations-logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"/>
</head>
<body>
    <header>
        <a href="{{ url_for('upload') }}" class="brand" aria-label="Mangrove AI home">
            <img class="brand-logo" src="{{ url_for('static', filename='ai-first-nations-logo.png') }}" alt="">
            <span><strong>Mangrove AI</strong><small>AI First Nations</small></span>
        </a>
        <nav class="nav-tabs">
            <a href="{{ url_for('about') }}" class="nav-tab {{ 'nav-tab-active' if request.endpoint == 'about' else '' }}">About</a>
            <a href="{{ url_for('upload') }}" class="nav-tab {{ 'nav-tab-active' if request.endpoint == 'upload' else '' }}">Analyse</a>
        </nav>
    </header>
    
    <div class="container">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert" role="status" aria-live="polite">
                    {% for message in messages %}
                        <p>{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        
        {% block body %}
        {% endblock %}
    </div>
</body>

</html>
