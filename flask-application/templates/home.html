{% extends 'base.html' %}

{% block body %}
<h3>Mangrove Detection - AI First Nations </h3>
<p class="subtitle">Upload drone imagery to classify mangrove species</p>

<form method="post" enctype="multipart/form-data" id="upload-form">
    <label for="orthomosaic" class="file-label">Choose an orthomosaic image</label>

    <div id="drop-zone" class="drop-zone">
        <input type="file" name="orthomosaic" id="orthomosaic" accept=".png,.jpg,.jpeg" required>
        <div class="drop-zone-content">
            <span class="drop-zone-icon">⬆</span>
            <span class="drop-zone-text"><strong>Click to browse</strong> or drag an image here</span>
            <span class="drop-zone-hint">PNG, JPG, JPEG</span>
        </div>
    </div>

    <div id="preview-wrap" class="preview-wrap" hidden>
        <img id="preview-img" class="preview-img" alt="Selected image preview">
        <div class="preview-info">
            <span id="preview-name" class="preview-name"></span>
            <span id="preview-size" class="preview-size"></span>
            <button type="button" id="preview-clear" class="preview-clear">Remove</button>
        </div>
    </div>

    <input type="submit" value="Analyze Image" id="submit-btn" disabled>
</form>

<script>
    (function () {
        const fileInput = document.getElementById('orthomosaic');
        const dropZone = document.getElementById('drop-zone');
        const previewWrap = document.getElementById('preview-wrap');
        const previewImg = document.getElementById('preview-img');
        const previewName = document.getElementById('preview-name');
        const previewSize = document.getElementById('preview-size');
        const clearBtn = document.getElementById('preview-clear');
        const submitBtn = document.getElementById('submit-btn');

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function showPreview(file) {
            if (!file.type.startsWith('image/')) {
                resetPreview();
                return;
            }
            const reader = new FileReader();
            reader.onload = function (e) {
                previewImg.src = e.target.result;
                previewName.textContent = file.name;
                previewSize.textContent = formatSize(file.size);
                previewWrap.hidden = false;
                submitBtn.disabled = false;
            };
            reader.readAsDataURL(file);
        }

        function resetPreview() {
            fileInput.value = '';
            previewImg.src = '';
            previewWrap.hidden = true;
            submitBtn.disabled = true;
        }

        fileInput.addEventListener('change', function () {
            const file = fileInput.files && fileInput.files[0];
            if (file) {
                showPreview(file);
            } else {
                resetPreview();
            }
        });

        clearBtn.addEventListener('click', resetPreview);

        // Drag-and-drop support
        ['dragenter', 'dragover'].forEach(function (evt) {
            dropZone.addEventListener(evt, function (e) {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.add('drop-zone-active');
            });
        });

        ['dragleave', 'drop'].forEach(function (evt) {
            dropZone.addEventListener(evt, function (e) {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('drop-zone-active');
            });
        });

        dropZone.addEventListener('drop', function (e) {
            const files = e.dataTransfer && e.dataTransfer.files;
            if (files && files.length) {
                fileInput.files = files;
                showPreview(files[0]);
            }
        });
    })();
</script>
{% endblock %}
